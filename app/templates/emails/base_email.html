<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject or 'CampusConnect Notification' }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #f1f5f9;
      padding: 30px 10px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .header {
      background-color: #0f172a;
      padding: 24px 30px;
      text-align: left;
    }
    .brand-logo {
      display: inline-block;
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: #ffffff;
      border-radius: 8px;
      text-align: center;
      line-height: 32px;
      font-weight: 800;
      font-size: 16px;
      vertical-align: middle;
      margin-right: 10px;
    }
    .brand-title {
      display: inline-block;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      vertical-align: middle;
    }
    .content-body {
      padding: 32px 30px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }
    .badge-primary { background-color: #e0e7ff; color: #4338ca; }
    .badge-success { background-color: #dcfce7; color: #15803d; }
    .badge-warning { background-color: #fef3c7; color: #b45309; }
    .badge-danger { background-color: #fee2e2; color: #b91c1c; }
    .badge-info { background-color: #e0f2fe; color: #0369a1; }
    
    h1, h2, h3 {
      color: #0f172a;
      margin-top: 0;
      font-weight: 700;
    }
    .title {
      font-size: 22px;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    p {
      margin: 0 0 16px 0;
      line-height: 1.6;
      font-size: 15px;
      color: #475569;
    }
    .info-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 20px 0;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      color: #64748b;
      font-weight: 500;
    }
    .info-value {
      color: #0f172a;
      font-weight: 600;
      text-align: right;
    }
    .btn-action {
      display: inline-block;
      background-color: #4f46e5;
      color: #ffffff !important;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      margin: 16px 0;
      text-align: center;
    }
    .footer {
      background-color: #f8fafc;
      padding: 24px 30px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }
    .footer a {
      color: #6366f1;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table class="container" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td class="header">
          <div class="brand-logo">C</div>
          <div class="brand-title">CampusConnect</div>
        </td>
      </tr>
      <tr>
        <td class="content-body">
          {% block email_content %}{% endblock %}
        </td>
      </tr>
      <tr>
        <td class="footer">
          <p style="margin-bottom: 8px; font-size: 12px; color: #64748b;">
            This is an automated notification from your <strong>CampusConnect</strong> academic portal.
          </p>
          <p style="margin: 0; font-size: 12px; color: #94a3b8;">
            You received this because email notifications are enabled for your account.<br>
            <a href="{{ base_url }}/auth/profile">Update your notification preferences</a> in your profile settings.
          </p>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
