{% extends "base.html" %}

{% block title %}Create Class Section - CampusConnect{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
  <div>
    <h3 class="fw-bold mb-1"><i class="bi bi-plus-circle text-primary me-2"></i>Create New Class Section</h3>
    <p class="text-muted small mb-0">Define an academic classroom section and assign faculty mentor</p>
  </div>
  <a href="{{ url_for('classes.index') }}" class="btn btn-outline-secondary btn-sm">&larr; Back to Classes</a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card card-custom p-4 shadow-sm">
      <form method="POST" action="{{ url_for('classes.create') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label fw-semibold small">Class Name *</label>
            <input type="text" class="form-control" name="name" placeholder="e.g. CSE-4A" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold small">Code Identifier *</label>
            <input type="text" class="form-control" name="code" placeholder="e.g. CSE-SEM4-A" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">Department *</label>
            <select class="form-select" name="department_id" required>
              <option value="">-- Choose Department --</option>
              {% for dept in departments %}
              <option value="{{ dept.id }}">{{ dept.name }} ({{ dept.code }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-semibold small">Semester *</label>
            <select class="form-select" name="semester" required>
              {% for s in range(1, 9) %}
              <option value="{{ s }}">Sem {{ s }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-semibold small">Section *</label>
            <input type="text" class="form-control" name="section" value="A" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">Academic Year *</label>
            <input type="text" class="form-control" name="academic_year" value="2025-2026" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">Class Coordinator / Mentor</label>
            <select class="form-select" name="teacher_id">
              <option value="">-- Assign Teacher --</option>
              {% for t in teachers %}
              <option value="{{ t.id }}">{{ t.full_name }} ({{ t.identifier }})</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="mt-4 text-end">
          <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
            <i class="bi bi-check2-circle me-1"></i> Create Class Section
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
