{% extends "base.html" %}

{% block title %}Post Announcement - CampusConnect{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
  <div>
    <h3 class="fw-bold mb-1"><i class="bi bi-megaphone text-danger me-2"></i>Post Campus Notice</h3>
    <p class="text-muted small mb-0">Broadcast alerts to students, teachers, or all campus users</p>
  </div>
  <a href="{{ url_for('announcements.index') }}" class="btn btn-outline-secondary btn-sm">&larr; Back</a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card card-custom p-4 shadow-sm">
      <form method="POST" action="{{ url_for('announcements.create') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold small">Notice Title *</label>
            <input type="text" class="form-control" name="title" placeholder="e.g. Mid-Semester Examination Schedule" required>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold small">Category *</label>
            <select class="form-select" name="category" required>
              {% for cat in categories %}
              <option value="{{ cat }}">{{ cat }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold small">Priority Level *</label>
            <select class="form-select" name="priority" required>
              {% for prio in priorities %}
              <option value="{{ prio }}" {% if prio == 'Medium' %}selected{% endif %}>{{ prio }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold small">Target Audience *</label>
            <select class="form-select" name="target_role" required>
              {% for role in target_roles %}
              <option value="{{ role }}">{{ role }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold small">Notice Body Content *</label>
            <textarea class="form-control" name="content" rows="6" placeholder="Write detailed notice information, instructions, dates, and locations..." required></textarea>
          </div>

          <div class="col-12 form-check ms-2">
            <input type="checkbox" class="form-check-input" id="is_pinned" name="is_pinned">
            <label class="form-check-label small fw-semibold" for="is_pinned">Pin this announcement to top of dashboard feed</label>
          </div>
        </div>

        <div class="mt-4 text-end">
          <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold">
            <i class="bi bi-broadcast me-1"></i> Broadcast Announcement
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
