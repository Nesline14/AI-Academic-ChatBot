{% extends "base.html" %}

{% block title %}Create Assignment - CampusConnect{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
  <div>
    <h3 class="fw-bold mb-1"><i class="bi bi-journal-plus text-primary me-2"></i>Publish New Assignment</h3>
    <p class="text-muted small mb-0">Set coursework instructions, due date, and maximum grading points</p>
  </div>
  <a href="{{ url_for('assignments.index') }}" class="btn btn-outline-secondary btn-sm">&larr; Back to Assignments</a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card card-custom p-4 shadow-sm">
      <form method="POST" action="{{ url_for('assignments.create') }}" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold small">Assignment Title *</label>
            <input type="text" class="form-control" name="title" placeholder="e.g. Lab 4: Dijkstra Shortest Path Implementation" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">Class Section *</label>
            <select class="form-select" name="class_id" required>
              <option value="">-- Choose Class --</option>
              {% for c in classes %}
              <option value="{{ c.id }}">{{ c.name }} (Sem {{ c.semester }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">Subject *</label>
            <select class="form-select" name="subject_id" required>
              <option value="">-- Choose Subject --</option>
              {% for s in subjects %}
              <option value="{{ s.id }}">{{ s.name }} ({{ s.code }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">Due Date & Time *</label>
            <input type="datetime-local" class="form-control" name="due_date" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">Maximum Marks *</label>
            <input type="number" step="0.5" class="form-control" name="max_marks" value="50" min="1" required>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold small">Assignment Description & Requirements *</label>
            <textarea class="form-control" name="description" rows="5" placeholder="Specify problem statement, input constraints, submission criteria, and evaluation rubrics..." required></textarea>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold small">Attachment (Optional File: PDF, ZIP, TXT, DOCX)</label>
            <input type="file" class="form-control" name="attachment_file">
          </div>
        </div>

        <div class="mt-4 text-end">
          <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
            <i class="bi bi-send me-1"></i> Publish Assignment to Students
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
