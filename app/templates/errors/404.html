{% extends "base.html" %}

{% block title %}Page Not Found (404) - CampusConnect{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
  <div class="col-md-6 text-center">
    <div class="text-primary mb-3">
      <i class="bi bi-compass fs-1" style="font-size: 4rem;"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">404 - Page Not Found</h1>
    <p class="text-muted mb-4">The academic page, module, or resource you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
      <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
