{% extends "base.html" %}

{% block title %}Internal Server Error (500) - CampusConnect{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
  <div class="col-md-6 text-center">
    <div class="text-warning mb-3">
      <i class="bi bi-exclamation-triangle fs-1" style="font-size: 4rem;"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">500 - Internal Server Error</h1>
    <p class="text-muted mb-4">Something went wrong while processing your request. Please try refreshing or contact system administrator.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
      <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
