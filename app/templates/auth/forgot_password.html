{% extends "base.html" %}

{% block title %}Forgot Password - CampusConnect{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card card-custom p-4 shadow-sm text-center">
      <div class="mb-3 text-primary">
        <i class="bi bi-key-fill fs-1"></i>
      </div>
      <h4 class="fw-bold mb-2">Reset Password</h4>
      <p class="text-muted small mb-4">Enter your registered email address to receive password recovery instructions.</p>

      <form method="POST" action="{{ url_for('auth.forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="mb-3 text-start">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" class="form-control" name="email" placeholder="name@campusconnect.com" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Send Reset Instructions</button>

        <a href="{{ url_for('auth.login') }}" class="small text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i> Back to Sign In
        </a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
