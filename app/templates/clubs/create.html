{% extends "base.html" %}

{% block title %}Register Student Club - CampusConnect{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
  <div>
    <h3 class="fw-bold mb-1"><i class="bi bi-people text-warning me-2"></i>Register Student Club</h3>
    <p class="text-muted small mb-0">Create an official campus student organization or technical society</p>
  </div>
  <a href="{{ url_for('clubs.index') }}" class="btn btn-outline-secondary btn-sm">&larr; Back</a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card card-custom p-4 shadow-sm">
      <form method="POST" action="{{ url_for('clubs.create') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label fw-semibold small">Club Name *</label>
            <input type="text" class="form-control" name="name" placeholder="e.g. Coding & AI Society" required>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold small">Club Code *</label>
            <input type="text" class="form-control" name="code" placeholder="e.g. CLUB-CODE-AI" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">Category *</label>
            <select class="form-select" name="category" required>
              {% for cat in categories %}
              <option value="{{ cat }}">{{ cat }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">Lead Coordinator / Faculty Mentor</label>
            <select class="form-select" name="coordinator_id">
              {% for coord in coordinators %}
              <option value="{{ coord.id }}">{{ coord.full_name }} ({{ coord.role_display }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">Regular Meeting Schedule</label>
            <input type="text" class="form-control" name="meeting_schedule" placeholder="e.g. Every Friday at 4:30 PM in Lab 3">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">Website / Social Hub URL</label>
            <input type="url" class="form-control" name="website_url" placeholder="https://...">
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold small">Mission & Description *</label>
            <textarea class="form-control" name="description" rows="4" placeholder="Describe the club's goals, weekly activities, hackathons, and membership benefits..." required></textarea>
          </div>
        </div>

        <div class="mt-4 text-end">
          <button type="submit" class="btn btn-warning px-4 py-2 fw-semibold text-dark">
            <i class="bi bi-check2-circle me-1"></i> Register Club
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
